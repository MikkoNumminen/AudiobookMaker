name: Test master

# Direct pushes to master (release version bumps, hotfixes) used to land
# without any machine running the test suite — "Build and Release" only
# tests pull requests and v* tags. This workflow closes that gap: every
# master push gets the same test run as a PR, and "Monitor CI failures"
# auto-opens an issue if it goes red. Detection, not prevention — branch
# protection cannot block the repo owner's pushes, and the release flow
# legitimately pushes bump commits straight to master.

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  # The local commit-msg hook (scripts/commit-msg) blocks vendor-branding
  # tokens at commit time, but `git commit --no-verify` — or a clone that
  # never ran scripts/install-hooks.sh — bypasses it. Re-scan every pushed
  # commit message here so a violation is flagged the moment it lands,
  # not when a human happens to read the history. Keep the pattern in
  # sync with scripts/commit-msg.
  commit-message-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan pushed commit messages for vendor-branding tokens
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          # Force-pushes (and the first push to a branch) can make BEFORE
          # unresolvable locally; fall back to scanning the head commit.
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            commits=$(git rev-list "$BEFORE..$AFTER")
          else
            commits=$(git rev-list -1 "$AFTER")
          fi
          bad=0
          for c in $commits; do
            if git log -1 --format=%B "$c" | grep -qiE 'claude|anthropic'; then
              echo "::error::Commit $c message contains a banned vendor token (see the 'Commit messages' policy in the root rules file). Matched line(s):"
              git log -1 --format=%B "$c" | grep -inE 'claude|anthropic' | sed 's/^/  /'
              bad=1
            fi
          done
          exit $bad

  # The pre-commit hook blocks staging book/audiobook source formats, but
  # --no-verify or an uninstalled hook bypasses it. Re-check the tracked tree
  # on every push so a source-material file that slipped past the local gate is
  # flagged immediately (copyright P0). Keep the pattern in sync with the
  # pre-commit source-format gate.
  copyright-floor-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan the tracked tree for book/audiobook source formats
        run: |
          hits=$(git ls-files | grep -iE '\.(epub|m4b|mobi|azw3?|aax|m4a)$' || true)
          if [ -n "$hits" ]; then
            echo "::error::Tracked book/audiobook source file(s) found — copyright P0. Move them to gitignored .local/ and remove from history:"
            echo "$hits" | sed 's/^/  /'
            exit 1
          fi
          echo "No tracked source-material formats."

  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # Mirrors the "Build and Release" test step exactly (same GUI-file
        # ignore list, same flags — see the WHY comments there). If you
        # change one, change both.
        run: >-
          python -m pytest tests/
          --ignore=tests/test_record_voice_sample.py
          --ignore=tests/test_single_instance.py
          --ignore=tests/test_voice_recorder.py
          --ignore=tests/test_gui_clone_voice.py
          --ignore=tests/test_gui_clone_voice_hygiene.py
          --ignore=tests/test_gui_drag_drop.py
          --ignore=tests/test_gui_e2e.py
          --ignore=tests/test_gui_engine_dialog.py
          --ignore=tests/test_gui_settings_frame_report_bug.py
          --ignore=tests/test_gui_synth_mixin.py
          --ignore=tests/test_gui_temp_sample_cleanup.py
          --ignore=tests/test_gui_unified.py
          --ignore=tests/test_gui_update_mixin.py
          -x -q --tb=short -p no:timeout
