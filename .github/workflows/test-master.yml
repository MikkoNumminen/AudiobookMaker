name: Test master

# Direct pushes to master (release version bumps, hotfixes) used to land
# without any machine running the test suite — "Build and Release" only
# tests pull requests and v* tags. This workflow closes that gap: every
# master push gets the same test run as a PR, and "Monitor CI failures"
# auto-opens an issue if it goes red. Detection, not prevention — branch
# protection cannot block the repo owner's pushes, and the release flow
# legitimately pushes bump commits straight to master.

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # Mirrors the "Build and Release" test step exactly (same GUI-file
        # ignore list, same flags — see the WHY comments there). If you
        # change one, change both.
        run: >-
          python -m pytest tests/
          --ignore=tests/test_record_voice_sample.py
          --ignore=tests/test_single_instance.py
          --ignore=tests/test_voice_recorder.py
          --ignore=tests/test_gui_clone_voice.py
          --ignore=tests/test_gui_clone_voice_hygiene.py
          --ignore=tests/test_gui_drag_drop.py
          --ignore=tests/test_gui_e2e.py
          --ignore=tests/test_gui_engine_dialog.py
          --ignore=tests/test_gui_settings_frame_report_bug.py
          --ignore=tests/test_gui_synth_mixin.py
          --ignore=tests/test_gui_temp_sample_cleanup.py
          --ignore=tests/test_gui_unified.py
          --ignore=tests/test_gui_update_mixin.py
          -x -q --tb=short -p no:timeout
