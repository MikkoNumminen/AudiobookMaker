name: Build and Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # Most test_gui_*.py files are STILL skipped in CI even though their
        # tests use object.__new__ stubs / importorskip guards. The reason
        # is transitive: many of them import src.* modules that do
        # `from tkinter import messagebox` or `import tkinter as tk` at
        # module top (e.g. src/single_instance.py, src/voice_recorder.py).
        # On headless GHA Windows that module-level import initialises the
        # Tcl notifier thread, which the UnifiedApp.destroy() teardown in
        # this PR cannot reach (it only cancels OUR _scheduled_afters; it
        # cannot reach the Tcl notifier owned by _tkinter.pyd).
        #
        # The only newly-re-enabled file we KNOW is safe is
        # tests/test_gui_style.py, because it was specifically refactored
        # in this PR (pytest.importorskip + split into headless constant
        # tests + Tk-gated tests with TclError skip in the fixture).
        #
        # The destroy() refactor in this PR is still genuinely useful:
        # production-app teardown is now cleaner (no brittle "update"
        # substring heuristic), and the contract is locked in by 16
        # mocked unit tests in test_gui_unified_destroy.py.
        #
        # Re-enabling the other GUI test files is a v3.12+ followup that
        # needs investigation of the module-level tkinter import side
        # effects on headless GHA Windows.
        #
        # -p no:timeout: pytest-timeout's thread method cannot cleanly cancel
        # its timer on Windows; if any real-Tk test slips through and the
        # post-summary hang fires, the late-firing timer would crash the
        # build via AssertionError in read_global_capture(). Disabling the
        # plugin in CI sidesteps that. The GHA job timeout is the runaway
        # guard; per-test timeouts still apply locally via pytest.ini.
        # --cov is also dropped: coverage finalisation extends the shutdown
        # phase enough to widen the Tk-thread join window.
        run: >-
          python -m pytest tests/
          --ignore=tests/test_record_voice_sample.py
          --ignore=tests/test_single_instance.py
          --ignore=tests/test_voice_recorder.py
          --ignore=tests/test_gui_clone_voice.py
          --ignore=tests/test_gui_clone_voice_hygiene.py
          --ignore=tests/test_gui_drag_drop.py
          --ignore=tests/test_gui_e2e.py
          --ignore=tests/test_gui_engine_dialog.py
          --ignore=tests/test_gui_settings_frame_report_bug.py
          --ignore=tests/test_gui_synth_mixin.py
          --ignore=tests/test_gui_temp_sample_cleanup.py
          --ignore=tests/test_gui_unified.py
          --ignore=tests/test_gui_update_mixin.py
          -x -q --tb=short -p no:timeout

      - name: Download ffmpeg
        if: github.event_name == 'push'
        env:
          FFMPEG_RELEASE: autobuild-2026-06-03-14-37
          FFMPEG_ZIP: ffmpeg-n7.1.4-9-gc06af95f12-win64-gpl-7.1.zip
          FFMPEG_SHA256: 305f5ac85ab794431fd32c724a30e2a8638b54fee6d2d983233685d937ccb9c7
          FFMPEG_DIR: ffmpeg-n7.1.4-9-gc06af95f12-win64-gpl-7.1
        run: |
          curl -L -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_RELEASE}/${FFMPEG_ZIP}"
          echo "${FFMPEG_SHA256}  ffmpeg.zip" | sha256sum -c -
          7z x ffmpeg.zip -offmpeg_tmp
          mkdir -p dist/ffmpeg
          cp "ffmpeg_tmp/${FFMPEG_DIR}/bin/ffmpeg.exe" dist/ffmpeg/ffmpeg.exe
          cp "ffmpeg_tmp/${FFMPEG_DIR}/bin/ffplay.exe" dist/ffmpeg/ffplay.exe
          cp "ffmpeg_tmp/${FFMPEG_DIR}/bin/ffprobe.exe" dist/ffmpeg/ffprobe.exe
        shell: bash

      - name: Bundle Tesseract + Ghostscript for OCR fallback
        # Stages dist/ocr/ before PyInstaller runs. audiobookmaker.spec
        # picks up the files conditionally — when this step is skipped
        # (e.g. for a PR-only build) PyInstaller produces a no-OCR build
        # that degrades gracefully on scanned PDFs (EmptyPDFError instead
        # of crash). See src/ocr_path.py and src/pdf_parser.py.
        #
        # Trained-data is pinned to the tessdata_fast 4.1.0 release tag
        # (latest tag as of 2026-05-12 — the repo releases roughly every
        # Tesseract major bump, so we re-evaluate whenever pyocr / Tesseract
        # itself moves). Both files are SHA-verified; SHAs lifted into the
        # YAML env: block above the run: block to mirror the ffmpeg-pin
        # shape (see "Download ffmpeg" step) and stay greppable.
        if: github.event_name == 'push'
        env:
          TESSDATA_RELEASE: "4.1.0"
          ENG_TRAINEDDATA_SHA: 7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2
          FIN_TRAINEDDATA_SHA: 61a04cd62b507c3d9ae0e1cda399e6715ebf49dea9df47897c8acdcd3bd3e13c
        run: |
          set -e
          mkdir -p dist/ocr/tessdata
          # Tesseract: Chocolatey is preinstalled on GHA Windows runners.
          # The choco package installs to "C:\Program Files\Tesseract-OCR".
          # We use it for the binary + DLLs + configs/ subdir only; the
          # trained-data ships from tessdata_fast at a pinned tag below.
          choco install tesseract -y --no-progress
          TESS_DIR="/c/Program Files/Tesseract-OCR"
          cp "$TESS_DIR/tesseract.exe" dist/ocr/
          cp "$TESS_DIR"/*.dll dist/ocr/ 2>/dev/null || true
          # Pull both eng and fin from tessdata_fast at the pinned tag so
          # the bundled trained-data isn't subject to choco-package drift.
          # SHA-verified the same way ffmpeg.zip is checked above.
          curl -L -o dist/ocr/tessdata/eng.traineddata \
            "https://github.com/tesseract-ocr/tessdata_fast/raw/${TESSDATA_RELEASE}/eng.traineddata"
          echo "${ENG_TRAINEDDATA_SHA}  dist/ocr/tessdata/eng.traineddata" | sha256sum -c -
          curl -L -o dist/ocr/tessdata/fin.traineddata \
            "https://github.com/tesseract-ocr/tessdata_fast/raw/${TESSDATA_RELEASE}/fin.traineddata"
          echo "${FIN_TRAINEDDATA_SHA}  dist/ocr/tessdata/fin.traineddata" | sha256sum -c -
          # configs/ holds Tesseract output-format presets (hocr, txt, pdf
          # etc.) that ocrmypdf invokes via the Tesseract subprocess.
          # Without these files OCR runs to 100% then ocrmypdf crashes
          # trying to read empty .hocr output (caught during PR #26 smoke
          # test on a 32-page scanned PDF). Shipped by the choco package
          # alongside the binary; not part of the tessdata_fast pin.
          cp -r "$TESS_DIR/tessdata/configs" dist/ocr/tessdata/
          # Ghostscript: ocrmypdf calls gswin64c.exe for image preprocessing
          # of certain scanned PDF layouts. Glob the version-prefixed install
          # dir so a Ghostscript point release doesn't break this step.
          choco install ghostscript -y --no-progress
          GS_BIN=$(ls -d /c/Program\ Files/gs/gs*/bin 2>/dev/null | head -1)
          if [ -n "$GS_BIN" ]; then
            cp "$GS_BIN/gswin64c.exe" dist/ocr/
            cp "$GS_BIN/gsdll64.dll" dist/ocr/
          else
            echo "Ghostscript install dir not found — OCR will skip layouts that need GS preprocessing"
          fi
          echo "---"
          ls -la dist/ocr/ dist/ocr/tessdata/
        shell: bash

      - name: Create placeholder icon if missing
        if: github.event_name == 'push'
        run: |
          if [ ! -f assets/icon.ico ]; then
            pip install Pillow==12.2.0  # keep in sync with requirements.txt
            python -c "
          from PIL import Image
          img = Image.new('RGBA', (256, 256), (52, 101, 164, 255))
          img.save('assets/icon.ico', format='ICO', sizes=[(256, 256)])
          "
          fi
        shell: bash

      - name: Extract version from tag
        if: github.event_name == 'push'
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Stamp version into source
        if: github.event_name == 'push'
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          (Get-Content src/auto_updater.py) -replace 'APP_VERSION = ".*"', "APP_VERSION = `"$version`"" | Set-Content src/auto_updater.py
        shell: pwsh

      # Guard: the `version = "..."` field in pyproject.toml MUST match
      # APP_VERSION before we rewrite it from the tag. Drift here does not
      # break the .exe installer (that path goes through setup.iss) but it
      # ships a pip-installable package stamped with the wrong version,
      # which breaks every downstream tool that consults pyproject for
      # version info (CI matrices, deduplication caches, dependency
      # solvers). Fail the job loudly instead.
      - name: Verify pyproject.toml version matches APP_VERSION
        if: github.event_name == 'push'
        run: |
          $pyVersion = (python -c "from src.auto_updater import APP_VERSION; print(APP_VERSION)").Trim()
          $tomlLine = Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $tomlLine) {
            Write-Error "pyproject.toml is missing a top-level version = `"...`" line. Cannot verify version sync."
            exit 1
          }
          $tomlVersion = $tomlLine.Matches[0].Groups[1].Value
          Write-Host "Python APP_VERSION: $pyVersion"
          Write-Host "pyproject.toml version: $tomlVersion"
          if ($pyVersion -ne $tomlVersion) {
            Write-Error "Version drift: src/auto_updater.py APP_VERSION ($pyVersion) does not match pyproject.toml version ($tomlVersion). Update one or both so they agree, otherwise the published pip package will ship with the wrong version stamp."
            exit 1
          }
          Write-Host "pyproject.toml version matches APP_VERSION — OK."
        shell: pwsh

      - name: Update pyproject.toml version from tag
        if: github.event_name == 'push'
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          (Get-Content pyproject.toml) -replace '^version\s*=\s*"[^"]+"', "version = `"$version`"" | Set-Content pyproject.toml
        shell: pwsh

      - name: Verify runner imports match spec datas
        if: github.event_name == 'push'
        run: python scripts/check_spec_runner_imports.py

      - name: Build exe with PyInstaller
        if: github.event_name == 'push'
        run: pyinstaller audiobookmaker.spec

      - name: Install Inno Setup
        if: github.event_name == 'push'
        run: choco install innosetup --yes --no-progress

      # Guard: the Inno Setup `#define MyAppVersion` MUST match Python's
      # APP_VERSION before we rewrite it from the tag. If these have drifted,
      # a developer-local off-CI build would ship a mis-branded installer and
      # corrupt the auto-update upgrade graph. Fail the job loudly instead.
      - name: Verify Inno Setup version matches APP_VERSION
        if: github.event_name == 'push'
        run: |
          $pyVersion = (python -c "from src.auto_updater import APP_VERSION; print(APP_VERSION)").Trim()
          $issLine = Select-String -Path installer/setup.iss -Pattern '^#define\s+MyAppVersion\s+"([^"]+)"' | Select-Object -First 1
          if (-not $issLine) {
            Write-Error "installer/setup.iss is missing a #define MyAppVersion line. Cannot verify version sync."
            exit 1
          }
          $issVersion = $issLine.Matches[0].Groups[1].Value
          Write-Host "Python APP_VERSION: $pyVersion"
          Write-Host "Inno Setup MyAppVersion: $issVersion"
          if ($pyVersion -ne $issVersion) {
            Write-Error "Version drift: src/auto_updater.py APP_VERSION ($pyVersion) does not match installer/setup.iss #define MyAppVersion ($issVersion). Update one or both so they agree, otherwise off-CI builds will ship a mis-branded installer and break the auto-update upgrade graph."
            exit 1
          }
          Write-Host "Inno Setup version matches APP_VERSION — OK."
        shell: pwsh

      - name: Update Inno Setup version from tag
        if: github.event_name == 'push'
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          (Get-Content installer/setup.iss) -replace '#define\s+MyAppVersion\s+"[^"]+"', "#define MyAppVersion `"$version`"" | Set-Content installer/setup.iss
        shell: pwsh

      - name: Build installer
        if: github.event_name == 'push'
        run: iscc installer/setup.iss

      - name: Upload installer artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer/Output/*.exe

      # ── CLI standalone zip ────────────────────────────────────────────────
      # Builds a console-mode audiobookmaker.exe with bundled ffmpeg so users
      # can unzip, add to PATH, and run `audiobookmaker convert book.pdf`
      # without installing Python. No Tk / CustomTkinter / ML stack included.
      - name: Build CLI exe with PyInstaller
        if: github.event_name == 'push'
        run: pyinstaller audiobookmaker_cli.spec

      - name: Package CLI zip
        if: github.event_name == 'push'
        id: cli_zip
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $zipName = "AudiobookMaker-CLI-$version-windows-x64.zip"
          # dist/audiobookmaker_cli/ is the COLLECT output folder from the spec
          # (named to avoid a case-insensitive clash with dist/AudiobookMaker/).
          Compress-Archive -Path dist/audiobookmaker_cli/* -DestinationPath $zipName
          Write-Host "Packaged: $zipName"
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        shell: pwsh

      - name: Compute CLI zip SHA-256
        if: github.event_name == 'push'
        id: cli_sha
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $zipName = "${{ steps.cli_zip.outputs.ZIP_NAME }}"
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower()
          Write-Host "CLI zip SHA-256: $hash"
          "CLI_HASH=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # Sidecar .sha256 file uploaded alongside the zip so users can
          # verify the download without parsing release notes.
          "$hash  $zipName" | Out-File `
              -FilePath "$zipName.sha256" `
              -Encoding ascii -NoNewline
        shell: pwsh

      - name: Upload CLI artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: cli-zip
          path: |
            ${{ steps.cli_zip.outputs.ZIP_NAME }}
            ${{ steps.cli_zip.outputs.ZIP_NAME }}.sha256

      # Auto-update is the lifeline to existing users. Every released installer
      # MUST publish its SHA-256 — both inside the release notes (where the
      # auto-updater reads it) and as a sidecar `.exe.sha256` asset (the
      # in-code fallback path). v3.7.0 shipped without the hash and broke
      # auto-update for every existing user; this step exists so that can
      # never happen again. See CONVENTIONS.md "Auto-update is critical".
      - name: Compute installer SHA-256 and write release notes
        if: github.event_name == 'push'
        id: sha
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $exe = "installer/Output/AudiobookMaker-Setup-$version.exe"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          Write-Host "Installer SHA-256: $hash"
          "HASH=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          # Sidecar asset that the auto-updater can fall back to if it can't
          # parse the release-notes body for any reason.
          "$hash  AudiobookMaker-Setup-$version.exe" | Out-File `
              -FilePath "installer/Output/AudiobookMaker-Setup-$version.exe.sha256" `
              -Encoding ascii -NoNewline
          # Build the release notes as an array of lines and write to a file.
          # Using an array (not a here-string) so the YAML literal block can
          # keep uniform indentation without leaking spaces into the output.
          $exeName = "AudiobookMaker-Setup-$version.exe"
          $cliZipName = "${{ steps.cli_zip.outputs.ZIP_NAME }}"
          $cliHash = "${{ steps.cli_sha.outputs.CLI_HASH }}"
          $lines = @(
            "## AudiobookMaker $version",
            "",
            "Unified release - one app, one installer, all engines.",
            "",
            "### What's new",
            "",
            "- Single unified GUI replaces both the old Main and Launcher installers",
            "- Finnish/English UI language toggle",
            "- PDF and plain text input modes",
            "- In-app engine installer (install Chatterbox without leaving the app)",
            "- Edge-TTS, Piper, and Chatterbox Finnish all in one window",
            "",
            "### Installation",
            "",
            "1. Download ``$exeName`` below",
            "2. Double-click - click **More info** -> **Run anyway** on the SmartScreen warning",
            "3. Follow the installer prompts",
            "4. Open AudiobookMaker from the Start Menu",
            "5. To add Chatterbox (best Finnish quality, needs NVIDIA GPU): click **Install engines** inside the app",
            "",
            "No Python or other dependencies needed - everything is bundled.",
            "",
            "### CLI (command-line interface)",
            "",
            "Download ``$cliZipName``, unzip, add the folder to PATH, then:",
            "",
            "``````",
            "audiobookmaker convert book.pdf",
            "``````",
            "",
            "No Python required. Run ``audiobookmaker --help`` for all options.",
            "",
            "---",
            "SHA-256: $hash",
            "CLI: SHA-256: $cliHash"
          )
          Set-Content -Path release_notes.md -Value $lines -Encoding utf8
        shell: pwsh

      # Belt-and-braces: refuse to publish if the rendered body does not
      # contain a 64-hex SHA-256 line. The auto-updater requires this; without
      # it every existing user is locked out of updates.
      # Also checks that the CLI SHA line is present — same rigor applied to
      # both delivery artifacts.
      - name: Guard — release notes must contain SHA-256 lines
        if: github.event_name == 'push'
        run: |
          $content = Get-Content release_notes.md -Raw
          # GUI installer SHA (consumed by the auto-updater). The `m` flag is
          # required: $content is the whole file as one string, so `^` without
          # multiline anchors to the start of the DOCUMENT, but the SHA-256
          # line sits near the end. Without `m` this guard can never pass.
          if (-not ($content -match '(?im)^SHA-256:\s*[0-9a-f]{64}' )) {
            Write-Error "release_notes.md is missing the GUI installer SHA-256 line — refusing to publish. Auto-update would break for every existing user."
            exit 1
          }
          # CLI zip SHA (informational + sidecar integrity)
          if (-not ($content -match '(?i)CLI:\s*SHA-256:\s*[0-9a-f]{64}')) {
            Write-Error "release_notes.md is missing the CLI SHA-256 line — refusing to publish."
            exit 1
          }
          Write-Host "release_notes.md contains both SHA-256 lines — OK to publish."
        shell: pwsh

      - name: Create GitHub Release
        if: github.event_name == 'push'
        # Pinned to a commit SHA (was @v2): this third-party action publishes
        # the release, so an upstream tag re-point can't change what runs.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          name: AudiobookMaker ${{ steps.version.outputs.VERSION }}
          body_path: release_notes.md
          files: |
            installer/Output/*.exe
            installer/Output/*.exe.sha256
            ${{ steps.cli_zip.outputs.ZIP_NAME }}
            ${{ steps.cli_zip.outputs.ZIP_NAME }}.sha256
          draft: false
          prerelease: false

      # Last line of defence: after the release is live, fetch the published
      # body via the GitHub API and verify the SHA lines survived. Catches the
      # rare case of a release-process bug that strips the body before publish.
      - name: Verify published release notes contain SHA-256 lines
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $body = gh release view "v$version" -R "${{ github.repository }}" --json body -q .body
          if (-not ($body -match '(?i)sha-?256:\s*[0-9a-f]{64}')) {
            Write-Error "Published release v$version is missing the GUI installer SHA-256 line. Auto-update will fail for every existing user. Restore it before announcing."
            exit 1
          }
          if (-not ($body -match '(?i)cli:\s*sha-?256:\s*[0-9a-f]{64}')) {
            Write-Error "Published release v$version is missing the CLI SHA-256 line. Restore it before announcing."
            exit 1
          }
          Write-Host "Published release v$version has both SHA-256 lines — auto-update path verified."
        shell: pwsh

      - name: Update README version links
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git checkout master
          git pull origin master
          $version = "${{ steps.version.outputs.VERSION }}"
          $readme = Get-Content -Raw README.md
          $readme = $readme -replace 'AudiobookMaker v\d+\.\d+\.\d+', "AudiobookMaker v$version"
          $readme = $readme -replace 'releases/tag/v\d+\.\d+\.\d+', "releases/tag/v$version"
          $readme = $readme -replace 'AudiobookMaker-Setup-\d+\.\d+\.\d+\.exe', "AudiobookMaker-Setup-$version.exe"
          Set-Content README.md $readme
          git add README.md
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "docs(readme): update download links to v$version"
            git push origin master
          } else {
            Write-Host "README already up to date"
          }
          exit 0
        shell: pwsh
