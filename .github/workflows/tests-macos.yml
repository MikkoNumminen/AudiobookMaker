name: Tests (macOS)

# Windows is the ship platform and runs the full non-GUI suite in CI; macOS is
# the DEV platform (Apple Silicon MacBook). Bugs that only surface on macOS
# slipped past CI entirely and were caught only when the developer happened to
# run the suite locally — e.g. a path-root check that knew Windows' TEMP/TMP
# but not macOS's TMPDIR, which failed locally and would have been red here.
#
# This job runs the same non-GUI selection as the Windows "Build and Release"
# run, on macos-latest (Apple Silicon — matches the dev arch), so macOS
# regressions are caught mechanically. GUI tests are covered separately on
# Linux+xvfb (gui-tests.yml) and Windows (gui-tests-windows.yml); they are
# excluded here for the same reasons the Windows build excludes them.

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # Mirrors the Windows "Build and Release" selection exactly (same
        # ignore list, same flags). If you change one, change both. A handful
        # of audio-export tests skip when ffmpeg is absent (not installed
        # here, matching the Windows job).
        run: >-
          python -m pytest tests/
          --ignore=tests/test_record_voice_sample.py
          --ignore=tests/test_single_instance.py
          --ignore=tests/test_voice_recorder.py
          --ignore=tests/test_gui_clone_voice.py
          --ignore=tests/test_gui_clone_voice_hygiene.py
          --ignore=tests/test_gui_drag_drop.py
          --ignore=tests/test_gui_e2e.py
          --ignore=tests/test_gui_engine_dialog.py
          --ignore=tests/test_gui_settings_frame_report_bug.py
          --ignore=tests/test_gui_synth_mixin.py
          --ignore=tests/test_gui_temp_sample_cleanup.py
          --ignore=tests/test_gui_unified.py
          --ignore=tests/test_gui_update_mixin.py
          -x -q --tb=short -p no:timeout
